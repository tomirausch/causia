spring:
  application:
    name: causia-backend
  datasource:
    url: ${CAUSIA_DB_URL:jdbc:mysql://localhost:3306/causia?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${CAUSIA_DB_USER:causia}
    password: ${CAUSIA_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway; Hibernate solo valida
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
